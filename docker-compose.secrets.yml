# Box-only overlay: mounts the three server-controlled secrets as files instead of
# injecting them into the container environment. Compose mounts each at
# /run/secrets/<name>. Nothing lands in `docker inspect`, /proc/<pid>/environ, or
# the spawned vault-query child's env.
#
# Perms: plain `docker compose` (non-swarm) bind-mounts file secrets and preserves
# the host file's mode (the uid/gid/mode secret options are swarm-only). The
# container runs as non-root `node`, so the host files must be 0444 or node hits
# EACCES; host-side access is gated by the 0700 secrets/ dir, not the file mode.
# See DEPLOY.md "Secrets on the box".
#
# Apply only on the box, after the base file:
#   docker compose --env-file stack.conf \
#     -f docker-compose.yml -f docker-compose.secrets.yml build mcp
#   docker compose --env-file stack.conf \
#     -f docker-compose.yml -f docker-compose.secrets.yml up -d mcp
#
# The actual values live in ./secrets/{mcp_bearer_token,mcp_auth_password,
# fireworks_api_key} (gitignored, chmod 600) and must NOT be set in stack.conf —
# an empty env var there makes the server fall back to the file (server reads
# MCP_BEARER_TOKEN before MCP_BEARER_TOKEN_FILE). Local dev skips this overlay and
# supplies secrets via env (Doppler / docker-compose.override.yml), so it needs no
# ./secrets files.
secrets:
  mcp_bearer_token:
    file: ./secrets/mcp_bearer_token
  mcp_auth_password:
    file: ./secrets/mcp_auth_password
  fireworks_api_key:
    file: ./secrets/fireworks_api_key

services:
  mcp:
    secrets:
      - mcp_bearer_token
      - mcp_auth_password
      - fireworks_api_key
    environment:
      - MCP_BEARER_TOKEN_FILE=/run/secrets/mcp_bearer_token
      - MCP_AUTH_PASSWORD_FILE=/run/secrets/mcp_auth_password
      - FIREWORKS_API_KEY_FILE=/run/secrets/fireworks_api_key
